  <body>
    <div id="root"></div>
    <script>
      // Restores URLs redirected by public/404.html for GitHub Pages SPA fallback.
      (function (location) {
        if (location.search[1] !== '/') return;

        var decoded = location.search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');

        window.history.replaceState(null, '', location.pathname.slice(0, -1) + decoded + location.hash);
      })(window.location);
    </script>
  </body>
